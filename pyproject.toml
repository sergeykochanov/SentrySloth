[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentrysloth"
version = "0.1.0"
description = "Change-risk / security-review assistant for open-source releases"
requires-python = ">=3.11"
authors = [{name = "sergeykochanov"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["security", "code-review", "llm", "gemini", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<14",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "httpx>=0.27,<1",
    "gitpython>=3.1,<4",
    "unidiff>=0.7,<1",
    "google-genai>=1.0,<2",
    "openai>=1.40,<2",
    "aiosqlite>=0.20,<1",
]

[project.urls]
Homepage = "https://github.com/sergeykochanov/SentrySloth"
"Bug Tracker" = "https://github.com/sergeykochanov/SentrySloth/issues"
"Source Code" = "https://github.com/sergeykochanov/SentrySloth"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.4",
    "respx>=0.21,<1",
]

[project.scripts]
sentrysloth = "sentrysloth.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentrysloth"]

[tool.hatch.build.targets.wheel.force-include]
"src/sentrysloth/py.typed" = "sentrysloth/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/sentrysloth/cache/storage.py" = ["S608"]
"src/sentrysloth/models.py" = ["S105"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["sentrysloth"]
